name: Keep API awake
# Бесплатный план Render усыпляет сервис через 15 минут без запросов.
# Пинг каждые 10 минут держит API тёплым. Отключи, когда перейдёшь на платный план.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 60 https://hack-the-case-api.onrender.com/health
