<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body, #root { margin:0; padding:0; min-height:100%; background: var(--surface-page); }
  body { font-family: var(--font-body-clean); color: var(--text-primary); }
  .main { max-width: 860px; margin:0 auto; padding: 56px 32px 96px; }
  .eyebrow { font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color: var(--text-tertiary); margin-bottom:10px; }
  h1 { font-family: var(--font-display-clean); font-weight:600; font-size:34px; letter-spacing: var(--tracking-tight); margin:0 0 28px; }
  .eval-row { display:flex; gap:40px; align-items:center; border:1px solid var(--border-hairline); border-radius: var(--r-clean-card); padding: 32px; margin-bottom:24px; background: var(--c-white); box-shadow: var(--shadow-clean-1); }
  .tags { display:flex; gap:8px; flex-wrap:wrap; }
  .coach-panel { border-radius: var(--r-clean-lg); background: var(--c-black); color:#fff; overflow:hidden; box-shadow: var(--shadow-clean-3); }
  .coach-head { padding: 18px 24px; border-bottom:1px solid rgba(255,255,255,0.12); display:flex; align-items:center; gap:12px; }
  .coach-head .av { width:36px; height:36px; border-radius:50%; background: var(--accent-primary); color: var(--c-black); display:flex; align-items:center; justify-content:center; font-weight:800; }
  .coach-head b { font-size:15px; }
  .coach-head span { display:block; font-size:11px; color: rgba(255,255,255,0.5); }
  .coach-log { padding: 22px 24px; display:flex; flex-direction:column; gap:14px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { ScoreDisplay, ChatBubble, Chip } = window.HackTheCaseDesignSystem_476677;
function EvaluatePage(){
  return (
    <div className="main">
      <div className="eyebrow">Шаг 7 из 7 · Оценка решения</div>
      <h1>Разбор твоего ответа</h1>
      <div className="eval-row">
        <ScoreDisplay score={78} max={100} label="Product Sense · попытка 2" />
        <div className="tags">
          <Chip face="clean" tone="accent">сильная структура</Chip>
          <Chip face="clean" tone="neutral">мало данных о конкурентах</Chip>
          <Chip face="clean" tone="neutral">чёткая рекомендация</Chip>
        </div>
      </div>
      <div className="coach-panel">
        <div className="coach-head">
          <div className="av">AI</div>
          <div><b>AI-коуч</b><span>Подсказки, а не готовые ответы</span></div>
        </div>
        <div className="coach-log">
          <ChatBubble from="coach">Хорошо разложил приоритизацию через RICE — но не учёл стоимость поддержки фичи после релиза.</ChatBubble>
          <ChatBubble from="student">Спасибо! А как оценивать эффект без данных о конкурентах?</ChatBubble>
          <ChatBubble from="coach">Строй гипотезу через прокси-метрики: retention похожих фич, время в похожих флоу.</ChatBubble>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<EvaluatePage/>);
</script>
</body>
</html>
