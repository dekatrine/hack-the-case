<!-- @dsCard group="Hack the Case" viewport="1280x820" name="LearningPage" subtitle="Уроки library — search, filters, lesson cards" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body, #root { margin:0; padding:0; min-height:100%; background: var(--surface-page); }
  body { font-family: var(--font-body-clean); color: var(--text-primary); }
  .shell { display:grid; grid-template-columns: 240px 1fr; min-height:100vh; }
  .sidebar { position:sticky; top:0; height:100vh; border-right:1px solid var(--border-hairline); padding: 24px 16px; display:flex; flex-direction:column; gap:2px; background: var(--c-white); }
  .brand { display:flex; align-items:center; gap:10px; padding: 0 8px 20px; }
  .brand .mark { width:36px; height:36px; border-radius:50%; background: var(--accent-primary); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; box-shadow: var(--shadow-clean-1); }
  .brand b { display:block; font-size:15px; font-weight:700; }
  .brand-subtitle { display:block; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color: var(--text-tertiary); font-weight:600; }
  .main { padding: 40px 48px 80px; max-width: 1040px; }
  .eyebrow { font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color: var(--text-tertiary); margin-bottom:10px; }
  h1 { font-family: var(--font-display-clean); font-weight:600; font-size:36px; letter-spacing: var(--tracking-tight); margin:0 0 12px; }
  .sub { color: var(--text-secondary); font-size:15px; max-width:600px; margin: 0 0 24px; line-height:1.5; }
  .search { display:flex; align-items:center; gap:10px; border:1px solid var(--border-hairline); border-radius: 999px; padding: 12px 18px; max-width:340px; margin-bottom:16px; color: var(--text-tertiary); background: var(--surface-sunk); }
  .filters { display:flex; gap:8px; margin-bottom: 24px; flex-wrap:wrap; }
  .filter { padding:9px 16px; border-radius:999px; font-size:13.5px; font-weight:600; border:1px solid var(--border-hairline); cursor:pointer; transition: background var(--dur-fast) var(--ease-standard), color var(--dur-fast) var(--ease-standard), border-color var(--dur-fast) var(--ease-standard); }
  .filter.active { background: var(--c-black); color:#fff; border-color: var(--c-black); box-shadow: var(--shadow-clean-1); }
  .path-card { padding:8px 12px; margin-bottom:28px; }
  .path-head { display:flex; justify-content:space-between; align-items:center; padding: 10px 8px 14px; }
  .path-head b { font-size:15px; font-weight:700; }
  .path-head span { font-size:12.5px; color: var(--text-tertiary); }
  .lessons { display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
  .lesson-card { display:flex; flex-direction:column; gap:8px; position:relative; }
  .lesson-card.is-done { opacity:0.62; }
  .lesson-card.is-active { border-color: var(--c-black) !important; }
  .lesson-check { position:absolute; top:20px; right:20px; width:22px; height:22px; border-radius:50%; background: var(--c-black); color:#fff; display:flex; align-items:center; justify-content:center; }
  .lesson-next-tag { position:absolute; top:20px; right:20px; }
  .lesson-top { display:flex; justify-content:space-between; align-items:center; }
  .lesson-card h3 { margin:0; font-size:18px; font-weight:700; }
  .lesson-card p { margin:0; color: var(--text-secondary); font-size:13.5px; line-height:1.5; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Chip, Card, Button, SidebarNavItem, StepRailItem } = window.HackTheCaseDesignSystem_476677;
const HomeIcon = <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 11l9-7 9 7v9a2 2 0 0 1-2 2h-4v-7H9v7H5a2 2 0 0 1-2-2z"/></svg>;
const BookIcon = <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 3h13a3 3 0 0 1 3 3v15H7a3 3 0 0 1-3-3z"/><path d="M4 18h16"/></svg>;
const PlayIcon = <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="9"/><polygon points="10 8 16 12 10 16" fill="currentColor"/></svg>;
const SearchIcon = <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg>;
const ClockIcon = <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>;

const CheckIcon = <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M20 6 9 17l-5-5"/></svg>;
const ArrowIcon = <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>;

const LESSONS = [
  ['done','Фреймворки','6 мин','MECE и дерево гипотез','Как раскладывать проблему на непересекающиеся исчерпывающие ветки.'],
  ['done','Фреймворки','5 мин','Принцип пирамиды Минто','Answer-first коммуникация: сначала вывод, потом обоснования.'],
  ['active','Основы','8 мин','Market sizing без паники','Top-down и bottom-up, как проговаривать допущения.'],
  ['pending','Фреймворки','7 мин','Profit tree','Раскладка прибыли на выручку и издержки для profitability-кейсов.'],
  ['pending','Метрики','5 мин','North Star Metric','Как выбрать одну ключевую метрику и не перепутать её с vanity-метрикой.'],
  ['pending','Метрики','4 мин','AARRR-воронка','Acquisition → Activation → Retention → Referral → Revenue.'],
];

function LearningPage(){
  return (
    <div className="shell">
      <aside className="sidebar">
        <div className="brand"><div className="mark">H</div><div><b>Hack the Case</b><span className="brand-subtitle">Тренажёр</span></div></div>
        <SidebarNavItem icon={HomeIcon} label="Главная" />
        <SidebarNavItem icon={BookIcon} label="Уроки" active />
        <SidebarNavItem icon={PlayIcon} label="Новый кейс" />
      </aside>
      <main className="main">
        <div className="eyebrow">Библиотека</div>
        <h1>Уроки</h1>
        <p className="sub">Короткие карточки с ключевыми фреймворками и метриками. Читаешь — сразу применяешь в кейсе.</p>
        <div className="search">{SearchIcon}<span>Поиск по названию…</span></div>
        <Card face="clean" className="path-card">
          <div className="path-head">
            <div><b>Твой путь</b><span> · 2 из 6 уроков пройдено</span></div>
            <Button face="clean" variant="primary" icon={ArrowIcon}>Продолжить: Market sizing без паники</Button>
          </div>
          {LESSONS.map((l, i) => (
            <StepRailItem key={l[3]} index={l[0] === 'done' ? CheckIcon : i + 1} name={l[3]} state={l[0]} />
          ))}
        </Card>
        <div className="filters">
          {['Все','Основы','Фреймворки','Метрики','Поведенческое','System Design'].map((f,i) => (
            <div key={f} className={`filter ${i===0 ? 'active' : ''}`}>{f}</div>
          ))}
        </div>
        <div className="lessons">
          {LESSONS.map(([state,tag,time,title,desc]) => (
            <Card face="clean" key={title} className={`lesson-card ${state === 'done' ? 'is-done' : ''} ${state === 'active' ? 'is-active' : ''}`}>
              <div className="lesson-top">
                <Chip face="clean" tone="neutral">{tag}</Chip>
                <span style={{display:'flex',alignItems:'center',gap:4,color:'var(--text-tertiary)',fontSize:12.5,fontWeight:600}}>{ClockIcon}{time}</span>
              </div>
              <h3>{title}</h3>
              <p>{desc}</p>
              {state === 'done' && <div className="lesson-check">{CheckIcon}</div>}
              {state === 'active' && <div className="lesson-next-tag"><Chip face="clean" tone="accent">Следующий</Chip></div>}
            </Card>
          ))}
        </div>
      </main>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<LearningPage/>);
</script>
</body>
</html>
